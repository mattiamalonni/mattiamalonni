name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=f97316&color_dots=#fed7aa,#fdba74,#fb923c,#f97316,#c2410c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish generated asset
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
