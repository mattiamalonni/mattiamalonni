name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths-ignore:
      - github-snake.svg
      - github-snake-dark.svg
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#216e39&color_dots=transparent,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Copy generated assets to the repository root
        run: |
          cp dist/github-snake.svg github-snake.svg
          cp dist/github-snake-dark.svg github-snake-dark.svg

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          add: github-snake.svg github-snake-dark.svg
          message: "chore: update contribution snake [skip ci]"
          default_author: github_actions
          pull: "--rebase --autostash"
